apiVersion: k3d.io/v1alpha4
kind: Simple
metadata:
  name: mycluster               # ชื่อ Cluster
servers: 1                      # จำนวน Control-plane (server) nodes
agents: 2                       # จำนวน Worker nodes
image: rancher/k3s:v1.28.8-k3s1 # ระบุ k3s image tag (แนะนำให้ล็อคเวอร์ชันที่เสถียร)

kubeAPI:
  host: "127.0.0.1"
  hostPort: "6550"

# การ Map Port จากเครื่อง Host เข้า Cluster Load Balancer
ports:
  - port: 8080:80               # Host port 8080 -> Ingress HTTP (80)
    nodeFilters:
      - loadbalancer
  - port: 8443:443              # Host port 8443 -> Ingress HTTPS (443)
    nodeFilters:
      - loadbalancer

# ตัวเลือกการตั้งค่า k3d
options:
  k3d:
    wait: true                  # รอจนกว่า cluster จะพร้อมทำงาน
    timeout: "120s"             # เวลา timeout ถ้าเกินจะตัดจบ
    disableLoadbalancer: false  # ไม่ปิด LoadBalancer

  # ส่ง Flag เข้าไปที่ k3s โดยตรง
  k3s:
    extraArgs:
      - arg: --disable=traefik  # ปิด Ingress Controller เริ่มต้น (ถ้าจะลง Traefik/Nginx เอง)
        nodeFilters:
          - server:*

  # อัปเดต kubeconfig เข้า ~/.kube/config ให้อัตโนมัติ
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
