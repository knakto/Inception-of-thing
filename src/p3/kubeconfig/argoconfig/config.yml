apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    path: src/p3/kubeconfig/my-app
    repoURL: 'https://github.com/knakto/Inception-of-thing.git'
    targetRevision: HEAD
  destination:
    namespace: dev
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
